<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>دریافت مختصات — لاین‌یار</title>
<style>body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}main{max-width:480px;margin:24px auto;padding:24px;background:white;border-radius:20px}button,input{box-sizing:border-box;font:inherit;font-size:16px;min-height:48px;width:100%;margin:8px 0;padding:12px;border:1px solid #94a3b8;border-radius:10px}button{background:#e0f2fe;color:#0c4a6e}button:disabled{opacity:.5}p{line-height:1.9}#status{color:#075985}</style></head>
<body><main><h1>مختصات فعلی گوشی</h1><p>این صفحه فقط موقعیت را دریافت می‌کند؛ اطلاعات پروژه در برنامه اصلی می‌ماند.</p><button id="locate">دریافت موقعیت فعلی</button><label for="coordinates">عرض و طول جغرافیایی</label><input id="coordinates" dir="ltr" readonly placeholder="35.689200, 51.389000"><p id="accuracy"></p><button id="copy" disabled>کپی مختصات</button><button id="apply" disabled>قرار دادن در پروژه و بازگشت</button><p id="status" role="status" aria-live="polite"></p><p>اگر آیفون ارتباط این صفحه و نسخه نصب‌شده را جدا کند، مختصات را کپی کنید؛ به لاین‌یار برگردید و «قرار دادن مختصات کپی‌شده در پروژه» را بزنید. نیازی به تایپ مختصات نیست.</p></main><script type="module" src="/src/browser-location.ts"></script></body></html>
